# Serves the static site and proxies /api to the API container.
#
# The point of the proxy is not load balancing — it is the Content Security
# Policy. Same-origin /api means `connect-src 'self'` can stay as it is; a
# cross-origin API forces the CSP open and adds a CORS preflight to every
# dashboard request. One rewrite is cheaper than both.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options    "nosniff"                        always;
  add_header X-Frame-Options           "SAMEORIGIN"                     always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy   "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;

  location /api/ {
    proxy_pass         http://api:8787;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    # A full mainnet scan can take a while; the API itself is fast, but a cold
    # pool connection to a hosted database is not instant.
    proxy_read_timeout 30s;
  }

  location /health {
    proxy_pass http://api:8787/health;
  }

  # `cleanUrls` parity with the Vercel deployment, so a link that works on one
  # works on the other.
  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  location ~* \.(css|js|svg|woff2)$ {
    expires 1h;
    add_header Cache-Control "public";
  }
}
