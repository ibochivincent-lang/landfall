name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Typecheck and tests run FIRST and unconditionally.
      #
      # They used to sit behind the database steps below, which meant a
      # missing DATABASE_URL secret skipped them entirely — the run went red
      # with no code signal at all, and "tests failing" and "secret absent"
      # looked identical from the outside. The code checks need no database,
      # so nothing should be able to stop them reporting.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The SDK is published to npm, and its publish build is not the same
      # compilation as `typecheck` above: it emits, and it pulls in two
      # sibling packages by relative path so the tarball is self-contained.
      # That means it can break in ways nothing else here would notice —
      # a moved file in packages/stp would leave the last published version
      # fine and the next one broken. Build it on every run so that failure
      # arrives now rather than at `npm publish`.
      - name: Build the publishable SDK
        run: npm run build -w @landfall/sdk

      # SECURITY.md names supply chain as in-scope, and until now nothing
      # checked. Runs on one Node version only — the dependency tree is the
      # same on both, so a second run would just duplicate the finding.
      #
      # Fails on high and critical, reports moderate and below without
      # blocking. The threshold is a judgement, not a default: a moderate
      # advisory in a dev-only tool should not stop a data-integrity fix from
      # merging, but a high in a tree that writes the published record — or
      # builds the oracle contract — should stop everything until it is looked
      # at. Both advisories present when this step was added (a fast-uri SSRF
      # chain and a qs DoS) were fixed rather than grandfathered in.
      - name: Audit dependencies
        if: matrix.node == '20'
        run: npm audit --audit-level=high

      - name: Report non-blocking advisories
        if: matrix.node == '20'
        continue-on-error: true
        run: npm audit --audit-level=low || true

      # ── Database steps ────────────────────────────────────────────────────
      # The database is optional in this project: the scan runs without it and
      # publishes static JSON either way. So an absent secret skips these with
      # a note rather than failing, but a secret that IS set and does not work
      # still fails the run — a broken database is worth knowing about, an
      # unconfigured one is not the same thing and should not read as one.
      - name: Install PostgreSQL client
        if: github.event_name == 'push' && matrix.node == '20' && env.DATABASE_URL != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Test database connection
        if: github.event_name == 'push' && matrix.node == '20' && env.DATABASE_URL != ''
        run: |
          psql "$DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -c "SELECT 1 AS database_ok;"

      - name: Run database migrations
        if: github.event_name == 'push' && matrix.node == '20' && env.DATABASE_URL != ''
        run: |
          chmod +x scripts/migrate.sh
          ./scripts/migrate.sh

      - name: Note skipped database checks
        if: github.event_name == 'push' && matrix.node == '20' && env.DATABASE_URL == ''
        run: |
          echo "DATABASE_URL is not set — connection and migration checks skipped."
          echo "Typecheck and tests above are unaffected; they need no database."
          echo "Set the secret in Settings → Secrets and variables → Actions to enable them."
