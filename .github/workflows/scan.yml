name: Hourly Ledger Scan

on:
  # Run every hour
  schedule:
    - cron: '0 * * * *'

  # Also allow a manual trigger from the GitHub Actions UI
  workflow_dispatch:
    inputs:
      since:
        description: 'Scan from date (ISO 8601, e.g. 2026-01-01). Leave blank for default.'
        required: false
        default: ''

concurrency:
  group: scan
  cancel-in-progress: false   # never cancel a running scan — let it finish

permissions:
  contents: write

jobs:
  scan:
    name: Scan → Persist → Update API JSON
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Need push access, so use the built-in token
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Node setup ─────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install dependencies ───────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # ── 4. Run the scan ───────────────────────────────────────────────────────
      # --persist writes to Supabase when DATABASE_URL is set.
      # Without it the scan still runs and writes JSON to ./out — that's enough
      # for the static API update step below.
      - name: Run ledger scan
        continue-on-error: true   # persist failure must not skip the JSON update
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          FLAGS="--horizon https://horizon.stellar.org --max-records 500 --concurrency 6 --dust 0.01 --out out"

          # Only add --since if provided via manual trigger
          if [ -n "${{ github.event.inputs.since }}" ]; then
            FLAGS="$FLAGS --since ${{ github.event.inputs.since }}"
          fi

          # Only persist to Supabase when DATABASE_URL is configured
          if [ -n "$DATABASE_URL" ]; then
            echo "DATABASE_URL found — will persist to Supabase"
            FLAGS="$FLAGS --persist"
          else
            echo "No DATABASE_URL — running scan only (static JSON will be updated)"
          fi

          npx tsx packages/indexer/src/cli.ts scan $FLAGS

      # ── 5. Convert scan output → static API JSON ──────────────────────────────
      # This runs regardless of whether --persist succeeded, so the static JSON
      # is always updated from the latest scan file on disk.
      - name: Convert scan → API JSON
        run: node scripts/scan-to-api.mjs

      # ── 6. Dispatch dark-transition webhooks ───────────────────────────────────
      # No-ops cleanly (exit 0, clear log line) until DATABASE_URL is set and
      # there are two finished scans to diff — see scripts/dispatch-webhooks.mjs.
      - name: Dispatch dark-transition webhooks
        continue-on-error: true   # a delivery failure must not block the JSON commit
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/dispatch-webhooks.mjs

      # ── 7. Publish scan digest to the Soroban oracle ───────────────────────────
      # No-ops cleanly until ORACLE_CONTRACT_ID/ORACLE_ADMIN_SECRET are set —
      # see scripts/publish-oracle.mjs and docs/gaps.md.
      - name: Publish scan digest to oracle
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ORACLE_CONTRACT_ID: ${{ secrets.ORACLE_CONTRACT_ID }}
          ORACLE_ADMIN_SECRET: ${{ secrets.ORACLE_ADMIN_SECRET }}
          SOROBAN_RPC_URL: ${{ secrets.SOROBAN_RPC_URL }}
        run: |
          if [ -n "$ORACLE_CONTRACT_ID" ] && [ -n "$ORACLE_ADMIN_SECRET" ]; then
            command -v stellar >/dev/null 2>&1 || cargo install --locked stellar-cli
          fi
          node scripts/publish-oracle.mjs

      # ── 8. Commit updated JSON back to main ───────────────────────────────────
      - name: Commit and push updated API snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/web/api/v1/anchors.json packages/web/snapshot.json
          # Only commit if there are actual changes
          git diff --staged --quiet || git commit -m "chore: hourly ledger scan $(date -u +%Y-%m-%d-%H00)"
          git push
