[package]
name = "landfall-oracle"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "On-chain settlement-quality digests for Stellar anchors."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
